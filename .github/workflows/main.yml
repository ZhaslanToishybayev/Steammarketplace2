name: Steam Marketplace CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      NODE_ENV: test
      STEAM_API_KEY: ci-test-key
      POSTGRES_USER: steam_user
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: steam_marketplace
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      JWT_SECRET: ci-test-jwt-secret-with-at-least-32-characters
      BOT_ACCOUNT_NAME: ci-bot
      BOT_PASSWORD: ci-bot-password
      STEAM_RETURN_URL: http://localhost:3001/auth/steam/return
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run unit tests
        run: npm run test:unit -- --runInBand --detectOpenHandles --forceExit

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
